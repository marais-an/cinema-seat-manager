<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de asientos de cine</title>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-xl space-y-6 px-4 py-10">
      <h1 class="text-3xl font-bold">Gestor de asientos de cine</h1>
      <p>Elegí un asiento libre para reservarlo.</p>
      <p><strong>L</strong> = libre · <strong>X</strong> = ocupado</p>

      <section aria-label="Mapa de asientos">
        <p class="mb-4 border-t-4 border-slate-400 pt-2 text-center">
          Pantalla
        </p>
        <div id="asientos" class="grid grid-cols-10 gap-1 sm:gap-2"></div>
      </section>

      <p id="mensaje" role="status"></p>
    </main>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
